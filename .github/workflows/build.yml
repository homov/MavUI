name: Build and test (self-hosted)

on:
  push:
    branches:
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  build:
    # Runs on the user's own Linux machine (self-hosted runner).
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    permissions:
      contents: write   # to publish ci/last-build.log back to the branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK info
        shell: bash
        run: dotnet --info

      - name: Build library
        shell: bash
        run: |
          set -o pipefail
          dotnet build Md3.Avalonia/Md3.Avalonia.csproj -c Release 2>&1 | tee build.log

      - name: Build tests and desktop samples
        shell: bash
        run: |
          set -o pipefail
          dotnet build Tests/Md3.Avalonia.Tests.csproj -c Release 2>&1 | tee -a build.log
          dotnet build samples/Demo/Md3.Demo.csproj -c Release 2>&1 | tee -a build.log
          dotnet build samples/Gallery/Md3.Gallery.csproj -c Release 2>&1 | tee -a build.log

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/Md3.Avalonia.Tests.csproj -c Release --no-build 2>&1 | tee -a build.log

      - name: Profile theme switch (only when commit message has [profile])
        if: contains(github.event.head_commit.message, '[profile]')
        shell: bash
        run: |
          mkdir -p ci/profile
          exec > >(tee ci/profile/profile-log.txt) 2>&1
          echo "pgrep: $(command -v pgrep || echo MISSING)"
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool update -g dotnet-trace || dotnet tool install -g dotnet-trace
          echo "dotnet-trace: $(command -v dotnet-trace || echo MISSING)"
          TRACE="$RUNNER_TEMP/theme.nettrace"
          TRACE_JSON="$RUNNER_TEMP/theme.speedscope.json"
          # Run the test in the background, then attach dotnet-trace to its testhost process.
          # dotnet-trace owns the trace session, so the file is written cleanly.
          MD3_PROFILE_ROUNDS=400 dotnet test Tests/Md3.Avalonia.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~Theme_switch_phases" > "$RUNNER_TEMP/test.log" 2>&1 &
          TEST_PID=$!
          PID=""
          for i in $(seq 1 300); do
            PID=$(pgrep -f 'testhost\.dll' | head -n1 || true)
            [ -n "$PID" ] && break
            sleep 0.2
          done
          echo "testhost pid: ${PID:-none}"
          if [ -n "$PID" ]; then
            dotnet-trace collect -p "$PID" --profile dotnet-sampled-thread-time \
              -o "$TRACE" --duration 00:01:00
          fi
          wait "$TEST_PID" || true
          tail -5 "$RUNNER_TEMP/test.log"
          if [ -s "$TRACE" ] && dotnet-trace convert --format speedscope "$TRACE"; then
            cp "$TRACE_JSON" ci/profile/theme.speedscope.json
            python3 tools/summarize_speedscope.py "$TRACE_JSON" 40 > ci/profile/theme-summary.txt || echo "summary failed"
          else
            echo "no trace produced or conversion failed" > ci/profile/theme-summary.txt
          fi

      - name: Upload raw profiler output (artifact only)
        if: contains(github.event.head_commit.message, '[profile]') && always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-trace-speedscope
          path: ${{ runner.temp }}/theme*
          if-no-files-found: ignore

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish build log to branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          if [ ! -f build.log ]; then echo "build.log was not produced" > build.log; fi
          mkdir -p ci
          {
            echo "# Last build log"
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat build.log
          } > ci/last-build.log
          git config user.name "mavui-ci"
          git config user.email "mavui-ci@users.noreply.github.com"
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git add -A ci
          if git diff --cached --quiet; then echo "No log changes"; exit 0; fi
          git commit -m "ci: update build log [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
