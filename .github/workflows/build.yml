name: Build and test (self-hosted)

# Android and Browser target builds run on manual dispatch or when a commit message contains [heads].
on:
  workflow_dispatch:   # manual run from the Actions tab; enables the Android/Browser step
  push:
    branches:
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  build:
    # Runs on the user's own Linux machine (self-hosted runner).
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    permissions:
      contents: write   # to publish ci/last-build.log back to the branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK info
        shell: bash
        run: dotnet --info

      - name: Build library
        shell: bash
        run: |
          set -o pipefail
          dotnet build MavUI/MavUI.csproj -c Release 2>&1 | tee build.log

      - name: Build tests and ControlsGallery desktop
        shell: bash
        run: |
          set -o pipefail
          dotnet build Tests/MavUI.Tests.csproj -c Release 2>&1 | tee -a build.log
          dotnet build samples/ControlsGallery/ControlsGallery.Desktop/ControlsGallery.Desktop.csproj -c Release 2>&1 | tee -a build.log
          dotnet build MavUI.Essentials/MavUI.Essentials.csproj -c Release 2>&1 | tee -a build.log
          dotnet build migrated/HC/HC/HC.csproj -c Release -f net10.0 2>&1 | tee -a build.log
          dotnet build migrated/HC/HC/HC.csproj -c Release -f net10.0-windows 2>&1 | tee -a build.log
          dotnet build migrated/HC/HC.Tests/HC.Tests.csproj -c Release 2>&1 | tee -a build.log
          

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/MavUI.Tests.csproj -c Release --no-build 2>&1 | tee -a build.log
          dotnet test migrated/HC/HC.Tests/HC.Tests.csproj -c Release --no-build 2>&1 | tee -a build.log

      - name: Build Android and Browser targets (manual runs or commit message contains [heads])
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[heads]')
        shell: bash
        run: |
          set -o pipefail
          dotnet workload install android wasm-tools 2>&1 | tee -a build.log
          dotnet build MavUI.Essentials/MavUI.Essentials.csproj -c Release -p:IncludeAndroid=true -p:IncludeBrowser=true 2>&1 | tee -a build.log
          dotnet build samples/ControlsGallery/ControlsGallery.Android/ControlsGallery.Android.csproj -c Release 2>&1 | tee -a build.log
          dotnet build samples/ControlsGallery/ControlsGallery.Browser/ControlsGallery.Browser.csproj -c Release 2>&1 | tee -a build.log

      - name: Profile theme switch (only when commit message has [profile])
        if: contains(github.event.head_commit.message, '[profile]')
        shell: bash
        run: |
          mkdir -p ci/profile
          exec > >(tee ci/profile/profile-log.txt) 2>&1
          echo "pgrep: $(command -v pgrep || echo MISSING)"
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool update -g dotnet-trace || dotnet tool install -g dotnet-trace
          echo "dotnet-trace: $(command -v dotnet-trace || echo MISSING)"
          TRACE="$RUNNER_TEMP/theme.nettrace"
          TRACE_JSON="$RUNNER_TEMP/theme.speedscope.json"
          # Run the test in the background, then attach dotnet-trace to its testhost process.
          # dotnet-trace owns the trace session, so the file is written cleanly.
          MAV_PROFILE_ROUNDS=400 dotnet test Tests/MavUI.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~Theme_switch_phases" > "$RUNNER_TEMP/test.log" 2>&1 &
          TEST_PID=$!
          PID=""
          for i in $(seq 1 300); do
            PID=$(pgrep -f 'testhost\.dll' | head -n1 || true)
            [ -n "$PID" ] && break
            sleep 0.2
          done
          echo "testhost pid: ${PID:-none}"
          if [ -n "$PID" ]; then
            dotnet-trace collect -p "$PID" --profile dotnet-sampled-thread-time \
              -o "$TRACE" --duration 00:01:00
          fi
          wait "$TEST_PID" || true
          tail -5 "$RUNNER_TEMP/test.log"
          cp "$RUNNER_TEMP/test.log" ci/profile/test-run.txt || true
          if [ -s "$TRACE" ]; then
            # Text report straight from the trace: top methods by exclusive (self) and inclusive time.
            dotnet-trace report "$TRACE" topN -n 5000 > "$RUNNER_TEMP/theme-top-full.txt" 2>&1 || true
            # Top of the report (mostly idle/waiting threads) plus every line that touches our code.
            { head -60 "$RUNNER_TEMP/theme-top-full.txt"; echo; echo "== Mav / Avalonia-controls / theme frames:";
              grep -E "Mav|MavTheme|MavButton|MavTextField|MavCard|MavSlider|Observe|ApplyTheme|ApplySizeTokens|ApplyShape|Rebuild|SyncAppResources|Avalonia\.(Controls|Layout|Rendering|Media)" "$RUNNER_TEMP/theme-top-full.txt" | head -150 || true; } > ci/profile/theme-top.txt
            { echo "full report lines: $(wc -l < "$RUNNER_TEMP/theme-top-full.txt")"; echo "--- test/theme/avalonia frames (count):"; grep -cE "ThemeSwitch|Theme_switch|Benchmark" "$RUNNER_TEMP/theme-top-full.txt" || true; grep -cE "Avalonia" "$RUNNER_TEMP/theme-top-full.txt" || true; echo "--- sample lines:"; grep -E "ThemeSwitch|Theme_switch|MavTheme|Avalonia\.Controls\.|Avalonia\.Threading|Dispatcher" "$RUNNER_TEMP/theme-top-full.txt" | head -40 || true; } > ci/profile/report-diag.txt
            dotnet-trace convert --format speedscope "$TRACE" || true
            if [ -s "$TRACE_JSON" ]; then
              python3 tools/summarize_speedscope.py "$TRACE_JSON" 40 > ci/profile/theme-summary.txt || true
              python3 -c "import json;d=json.load(open('$TRACE_JSON'));print('speedscope profiles:',[(p.get('type'),len(p.get('samples',[]))) for p in d.get('profiles',[])])" > ci/profile/speedscope-diag.txt || true
            fi
          else
            echo "no trace produced" > ci/profile/theme-top.txt
          fi

      - name: Upload raw profiler output (artifact only)
        if: contains(github.event.head_commit.message, '[profile]') && always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-trace-speedscope
          path: ${{ runner.temp }}/theme*
          if-no-files-found: ignore

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish build log to branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          if [ ! -f build.log ]; then echo "build.log was not produced" > build.log; fi
          mkdir -p ci
          {
            echo "# Last build log"
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat build.log
          } > ci/last-build.log
          git config user.name "mavui-ci"
          git config user.email "mavui-ci@users.noreply.github.com"
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git add -A ci
          if git diff --cached --quiet; then echo "No log changes"; exit 0; fi
          git commit -m "ci: update build log [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
