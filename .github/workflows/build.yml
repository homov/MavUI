name: Build and test (self-hosted)

on:
  push:
    branches:
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  build:
    # Runs on the user's own Linux machine (self-hosted runner).
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    permissions:
      contents: write   # to publish ci/last-build.log back to the branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK info
        shell: bash
        run: dotnet --info

      - name: Build library
        shell: bash
        run: |
          set -o pipefail
          dotnet build Md3.Avalonia/Md3.Avalonia.csproj -c Release 2>&1 | tee build.log

      - name: Build tests and desktop samples
        shell: bash
        run: |
          set -o pipefail
          dotnet build Tests/Md3.Avalonia.Tests.csproj -c Release 2>&1 | tee -a build.log
          dotnet build samples/Demo/Md3.Demo.csproj -c Release 2>&1 | tee -a build.log
          dotnet build samples/Gallery/Md3.Gallery.csproj -c Release 2>&1 | tee -a build.log

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/Md3.Avalonia.Tests.csproj -c Release --no-build 2>&1 | tee -a build.log

      - name: Profile theme switch (only when commit message has [profile])
        if: contains(github.event.head_commit.message, '[profile]')
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool update -g dotnet-trace || dotnet tool install -g dotnet-trace
          mkdir -p ci/profile
          # EventPipe CPU sampling for the testhost process (inherited by the child process).
          export DOTNET_EnableEventPipe=1
          export DOTNET_EventPipeConfig="Microsoft-DotNETCore-SampleProfiler:0:5,Microsoft-Windows-DotNETRuntime:0x10:5"
          export DOTNET_EventPipeOutputPath="$PWD/ci/profile/theme.nettrace"
          dotnet test Tests/Md3.Avalonia.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~Theme_switch_phases" 2>&1 | tee -a build.log
          unset DOTNET_EnableEventPipe DOTNET_EventPipeConfig DOTNET_EventPipeOutputPath
          dotnet-trace convert --format speedscope ci/profile/theme.nettrace 2>&1 | tee -a build.log
          python3 tools/summarize_speedscope.py ci/profile/theme.speedscope.json 40 > ci/profile/theme-summary.txt
          # Keep only the summary in git; raw traces are large.
          rm -f ci/profile/theme.nettrace ci/profile/theme.speedscope.json

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish build log to branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          if [ ! -f build.log ]; then echo "build.log was not produced" > build.log; fi
          mkdir -p ci
          {
            echo "# Last build log"
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat build.log
          } > ci/last-build.log
          git config user.name "mavui-ci"
          git config user.email "mavui-ci@users.noreply.github.com"
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git add -A ci
          if git diff --cached --quiet; then echo "No log changes"; exit 0; fi
          git commit -m "ci: update build log [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
