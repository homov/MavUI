name: Build (self-hosted)

on:
  push:
    branches:
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    # Runs on the user's own Linux machine with the self-hosted runner.
    # Does not consume GitHub-hosted Actions minutes.
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    permissions:
      contents: write   # needed to push the build log back to the branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show .NET SDK version
        # The .NET 10 SDK must be preinstalled on the runner machine.
        run: dotnet --info

      - name: Restore
        run: dotnet restore ref/Md3.Avalonia/Md3.Avalonia.csproj

      - name: Build
        run: dotnet build ref/Md3.Avalonia/Md3.Avalonia.csproj --no-restore -c Release 2>&1 | tee build.log

      - name: Headless render tests (screenshots)
        run: dotnet test tests/Md3.Avalonia.Headless.Tests/Md3.Avalonia.Headless.Tests.csproj -c Release 2>&1 | tee -a build.log

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish build log to branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          if [ ! -f build.log ]; then echo "build.log was not produced" > build.log; fi
          mkdir -p ci
          {
            echo "# Last build log"
            echo "commit: ${GITHUB_SHA}"
            echo "job status: ${{ job.status }}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat build.log
          } > ci/last-build.log
          git config user.name "mavui-ci"
          git config user.email "mavui-ci@users.noreply.github.com"
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git add -A ci
          if git diff --cached --quiet; then echo "No log changes"; exit 0; fi
          git commit -m "ci: update build log [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
