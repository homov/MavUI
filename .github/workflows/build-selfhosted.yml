name: Build (self-hosted)

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

jobs:
  build:
    # Runs on the user's own Linux machine with the self-hosted runner.
    # Does not consume GitHub-hosted Actions minutes.
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ref/Md3.Avalonia/Md3.Avalonia.csproj

      - name: Build
        run: dotnet build ref/Md3.Avalonia/Md3.Avalonia.csproj --no-restore -c Release 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
