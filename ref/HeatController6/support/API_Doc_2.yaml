        need_heat_state:
          type: string
          nullable: true
          description: Required heating state (can be null).
        device_id:
          type: string
          example: 6616ac7a221f02554d042c2b
          description: Unique identifier of the device.
        device_name:
          type: string
          example: example_dev_name
          description: Name of the device.
        temp_panel:
          type: string
          example: 22
          description: Temperature of the panel.
        temp_room:
          type: string
          example: 21
          description: Temperature in the room.
        need_temp_panel:
          type: string
          example: 80
          description: Required temperature of the panel.
        need_temp_room:
          type: string
          example: 23
          description: Required temperature in the room.
        group_id:
