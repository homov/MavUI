openapi: "3.0.2"
info:
  title: API Title
  version: "1.0"
servers:
  - url: http://localhost:8080
  - url: https://apitest.heatceram.com.ua
  - url: https://api.heatceram.com.ua
tags:
  - name: users
  - name: devices
  - name: schedules
  - name: groups

paths:

  /stinexapiv1/user_registration/:
    post:
      tags:
        - users
      summary: user_registration
      security: [ ]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "email_user"
                  example: "user@mail.com"
                password:
                  type: string
                  description: "password_user"
                  example: example_password
                timezone:
                  type: string
                  description: "timezone user"
                  example: 'Europe/Kyiv'
                language:
                  $ref: '#/components/schemas/SetLanguage'
              required:
                - email
                - password
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/StateResponse'

  /stinexapiv1/user_validation/:
    post:
      tags:
        - users
      summary: Валідація користувача
      security: []
