          example: 6621274736710020c29a29ef
          description: Unique identifier of the schedule.
        group_work:
          type: boolean
          example: false
          description: Group working mode (true or false).
        timer:
          type: integer
          default: 0
          example: 0
          description: Timer (0 or 1).
        is_sensor:
