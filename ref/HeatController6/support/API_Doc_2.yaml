      summary: update_schedule_type
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                schedule_id:
                  type: string
                  example: 65e59059be481568e809c557
                schedule_type:
                  type: string
                  example: manual
              required:
                - schedule_id
                - schedule_type
            examples:
              example_1:
                summary: by_manual
                value:
                  schedule_id: 65e59059be481568e809c557
                  schedule_type: manual
              example_2:
                summary: by_time
                value:
                  schedule_id: 65e59059be481568e809c557
                  schedule_type: time
              example_3:
                summary: by_temperature
                value:
                  schedule_id: 65e59059be481568e809c557
                  schedule_type: temperature
              example_4:
                summary: by_humidity
                value:
                  schedule_id: 65e59059be481568e809c557
                  schedule_type: humidity
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/GetScheduleByID"


  /stinexapiv1/update_schedule/:
    post:
      tags:
        - schedules
      summary: update_schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule_id:
                  type: string
                  example: 65e59059be481568e809c557
                schedule_type:
                  type: string
                  enum: [time, temperature, humidity, manual]
                schedule:
                  $ref: '#/components/schemas/schedule_week'
            examples:
              example1:
                summary: "by_manual"
                value:
                  schedule_id: 65e59059be481568e809c557
                  schedule_type: manual
                  schedule: |
                    {"monday":[{"h":0,"t":21,"s":1}],"tuesday":[{"h":0,"t":21,"s":1}],"wednesday":[{"h":0,"t":21,"s":1}],"thursday":[{"h":0,"t":21,"s":1}],"friday":[{"h":0,"t":21,"s":1}],"saturday":[{"h":0,"t":21,"s":1}],"sunday":[{"h":0,"t":21,"s":1}]}

              example2:
                summary: "by_time"
                value:
                  schedule_id: 65e59059be481568e809c557
                  schedule_type: time
                  schedule: |
                    {"monday":[{"h":0,"s":1}],"tuesday":[{"h":0,"s":1}],"wednesday":[{"h":0,"s":1}],"thursday":[{"h":0,"s":1}],"friday":[{"h":0,"s":1}],"saturday":[{"h":0,"s":1}],"sunday":[{"h":0,"s":1}]}
              example3:
                summary: "by_temperature"
                value:
                  schedule_id: 65e59059be481568e809c557
                  schedule_type: temperature
                  schedule:  |
                    {"monday":[{"h":0,"t":21,"s":1},{"h":1,"t":21,"s":1}],"tuesday":[{"h":0,"t":21,"s":1}],"wednesday":[{"h":0,"t":21,"s":1}],"thursday":[{"h":0,"t":21,"s":1}],"friday":[{"h":0,"t":21,"s":1}],"saturday":[{"h":0,"t":21,"s":1}],"sunday":[{"h":0,"t":21,"s":1}]}
              example4:
                summary: "by_humidity"
                value:
                  schedule_id: 65e59059be481568e809c557
                  schedule_type: humidity
                  schedule:  |
                    {"monday":[{"h":0,"p":21,"s":1},{"h":1,"p":21,"s":1}],"tuesday":[{"h":0,"p":21,"s":1}],"wednesday":[{"h":0,"p":21,"s":1}],"thursday":[{"h":0,"p":21,"s":1}],"friday":[{"h":0,"p":21,"s":1}],"saturday":[{"h":0,"p":21,"s":1}],"sunday":[{"h":0,"p":21,"s":1}]}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              examples:
                schedule_update_ok:
                  summary: schedule be updated
                  value:
#                    $ref: '#/components/schemas/update_schedule_response'
                    $ref: '#/components/schemas/StateResponse'

