chedule bad format", "UA": "поганий формат розкладу", "PL": "zaplanuj zły format"}, "e401": {"EN": "group not found", "UA": "група не знайдена", "PL": "nie znaleziono grupy"}, "e402": {"EN": "name already used", "UA": "назва вже використана", "PL": "nazwa już używana"}, "e403": {"EN": "error creating", "UA": "помилка створення групи", "PL": "tworzenie błędu"}, "e404": {"EN": "error creating schedule", "UA": "помилка створення розкладу", "PL": "błąd podczas tworzenia harmonogramu"}, "e405": {"EN": "user dont have groups", "UA": "користувач не має груп", "PL": "użytkownik nie ma grup"}, "e406": {"EN": "device not groupable", "UA": "пристрій неможливо згрупувати", "PL": "urządzenia nie można grupować"}, "e407": {"EN": "sensor not found", "UA": "датчик не знайдено", "PL": "nie znaleziono czujnika"}, "e408": {"EN": "group is not empty", "UA": "група не порожня", "PL": "grupa nie jest pusta"}}}

    app_version_response:
      allOf:
        - $ref: '#/components/schemas/StateResponse'
        - type: object
          nullable: true
          properties:
            need_update:
              type: boolean
#              nullable: true
              example: false
              description: "if true, then the update is required and the user should not be able to access other features"
            can_update:
                type: boolean
#                nullable: trueg
                example: true
                description: "if true, then an update is available, but it is not required, and the user can access the functionality anyway"
            last_version:
                type: string
#                nullable: true
                example: "2.1.2"
                description: "displays the latest available version of the application"
          example: |
                {"state": "ok", "need_update": true, "can_update": true, "current_version": "3.45.23"}
    
    

    schedules:
      type: object
      properties:
        schedule_id:
          type: string
          example: "662142bcc2361f1e04cfdfa9"
        reciver_id:
          type: string
          example: "66213c1336faff20c29a29f2"
        schedule_type:
          type: string
          enum:
            - manual
            - time
            - humidity
            - temperature
          example: "humidity"
        reciver_type:
          type: string
          example: "device"
          description: "or --> group"
        schedule:
          $ref: '#/components/schemas/schedule_week'

    schedule_week:
      properties:
        monday:
          $ref: '#/components/schemas/schedule_day_params'
        tuesday:
          $ref: '#/components/schemas/schedule_day_params'
        wednesday:
          $ref: '#/components/schemas/schedule_day_params'
        thursday:
          $ref: '#/components/schemas/schedule_day_params'
        friday:
          $ref: '#/components/schemas/schedule_day_params'
        saturday:
          $ref: '#/components/schemas/schedule_day_params'
        sunday:
          $ref: '#/components/schemas/schedule_day_params'

    schedule_day_params:
      type: array
      items:
        type: object
        properties:
          h:
            type: integer
            nullable: false
            description: hour
          s:
            type: integer
#            nullable: false
            nullable: true
            description: state
          t:
            type: integer
            nullable: true
            description: temperature
          p:
            type: integer
            nullable: true
            description: humidity
      description: >
        if this component contain t than schedule type is temperature or time and schedule cant contain h 
        if this component contain h than schedule type is humidity and schedule cant contain t 
        if t == null and p == null than schedule type is manual

